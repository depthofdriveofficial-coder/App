name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter project skeleton
        run: flutter create --org com.example --project-name test_app flutter_app

      - name: Copy custom main.dart into project
        run: cp lib/main.dart flutter_app/lib/main.dart

      - name: Build APK
        run: |
          cd flutter_app
          flutter build apk --release

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
